<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DKM AL IKHSAN - Masjid Al Makmur</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:sans-serif}
body{background:#0f0f0f;color:#fff;padding-bottom:90px}
.top{padding:20px}
.top small{color:#ff8c00;letter-spacing:1px;font-size:12px}
.top h1{font-size:24px;margin:2px 0}
.top .saldo{font-size:36px;font-weight:800;margin:8px 0 2px}
.top p{font-size:12px;color:#aaa}
.card{background:#1c1c1c;margin:12px;border-radius:18px;padding:16px}
.row{display:flex;gap:10px}
.stat{flex:1;background:#2a2a2a;border-radius:14px;padding:12px;text-align:center}
.stat span{font-size:12px;color:#aaa}
.stat b{display:block;font-size:17px;margin-top:4px}
.stat.masuk b{color:#22c55e}
.stat.keluar b{color:#ef4444}
.chart{display:flex;align-items:flex-end;gap:10px;height:90px;margin-top:14px}
.bar{flex:1;text-align:center}
.bar .val{font-size:11px;color:#ffb020;margin-bottom:4px}
.bar .fill{background:#ff7a00;border-radius:8px 8px 0 0;width:100%}
.bar .day{font-size:11px;color:#aaa;margin-top:6px}
.head{display:flex;justify-content:space-between;align-items:center}
.head span{font-size:12px;color:#aaa}
.item{display:flex;gap:12px;background:#2a2a2a;border-radius:14px;padding:12px;margin-top:12px;align-items:center}
.icon{width:44px;height:44px;border-radius:50%;background:#14341f;color:#22c55e;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0}
.icon.out{background:#3a1a1a;color:#ef4444}
.item b{font-size:15px}
.item small{color:#aaa;font-size:12px;display:block;margin-top:2px}
.item .del{color:#ef4444;font-size:12px;cursor:pointer}
.plus{color:#22c55e;font-weight:800;margin-left:auto;white-space:nowrap}
.min{color:#ef4444;font-weight:800;margin-left:auto;white-space:nowrap}
.empty{text-align:center;color:#888;padding:20px;font-size:13px}
.nav{position:fixed;bottom:0;left:0;right:0;background:#1c1c1c;display:flex;padding:10px 0;border-top:1px solid #333}
.nav button{flex:1;background:none;border:none;color:#888;font-size:12px;cursor:pointer}
.nav button.active{color:#ff7a00}
.nav .big{font-size:20px}
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.8);z-index:100;align-items:flex-end;justify-content:center}
.modal.show{display:flex}
.sheet{background:#1c1c1c;width:100%;max-width:480px;border-radius:22px 22px 0 0;padding:20px;padding-bottom:30px}
.sheet label{font-size:12px;color:#aaa;display:block;margin:12px 0 6px}
.sheet input,.sheet select{width:100%;padding:13px;border-radius:12px;border:1px solid #333;background:#111;color:#fff;font-size:15px;outline:none}
.radio{display:flex;gap:8px}
.radio button{flex:1;padding:11px;border-radius:10px;border:1px solid #333;background:#111;color:#fff;cursor:pointer;font-weight:700}
.radio button.on{background:#ff7a00;border-color:#ff7a00;color:#fff}
.sheet .save{width:100%;padding:14px;border:none;border-radius:12px;background:#ff7a00;color:#fff;font-weight:800;font-size:15px;margin-top:16px}
.sheet .batal{width:100%;padding:13px;border:none;border-radius:12px;background:#2a2a2a;color:#fff;margin-top:8px}
.cat{display:flex;gap:8px;flex-wrap:wrap}
.cat button{padding:9px 12px;border-radius:20px;border:1px solid #333;background:#111;color:#fff;font-size:12px}
.cat button.on{background:#fff;color:#000;font-weight:700}
</style>
</head>
<body>
<div class="top">
<small>MASJID AL MAKMUR</small>
<h1>DKM AL IKHSAN</h1>
<div class="saldo" id="saldo">Rp 0</div>
<p>Saldo Kas Masjid Al Makmur • Cengkudu</p>
</div>

<div class="card">
<div class="row">
<div class="stat masuk"><span>Total Masuk</span><b id="totalMasuk">Rp 0</b></div>
<div class="stat keluar"><span>Total Keluar</span><b id="totalKeluar">Rp 0</b></div>
</div>
<div style="margin-top:14px;display:flex;justify-content:space-between"><b>Infaq Minggu Ini</b><span style="color:#aaa;font-size:12px">7 hari terakhir</span></div>
<div class="chart" id="chart"></div>
</div>

<div class="card">
<div class="head"><b>Transaksi Terbaru</b><span id="jml">0 transaksi</span></div>
<div id="list"></div>
</div>

<div class="nav">
<button class="active">📊<br>Dashboard</button>
<button onclick="bukaForm('masuk')">💚<br>Infaq</button>
<button onclick="bukaForm('masuk')"><span class="big">⊞</span><br>+ Input</button>
<button>👥<br>Umat</button>
</div>

<div class="modal" id="modal">
<div class="sheet">
<h3 id="formJudul">Tambah Pemasukan</h3>
<label>Nama / Hamba Allah</label>
<input type="text" id="nama" value="Hamba Allah" placeholder="Hamba Allah">
<label>Kategori</label>
<div class="cat" id="catBox"></div>
<label>Mode Pembayaran</label>
<div class="radio" id="bayarBox">
<button type="button" class="on" onclick="pilihBayar(this,'QRIS')">QRIS</button>
<button type="button" onclick="pilihBayar(this,'Tunai')">Tunai</button>
<button type="button" onclick="pilihBayar(this,'Transfer')">Transfer</button>
</div>
<label>Nominal</label>
<input type="number" id="nominal" placeholder="Contoh: 700000">
<button class="save" onclick="simpan()">Simpan Transaksi</button>
<button class="batal" onclick="tutupForm()">Batal</button>
</div>
</div>

<script>
let data = JSON.parse(localStorage.getItem('kas_alikhsan_v2') || '[]');
let jenisAktif='masuk';
let bayarAktif='QRIS';
let katAktif='Infaq Jumat';
let katMasuk=['Infaq Jumat','Kotak Amal','Donasi','Infaq Harian'];
let katKeluar=['Listrik','Air / PDAM','Kebersihan','Perbaikan Masjid'];
function rupiah(n){return 'Rp '+n.toLocaleString('id-ID')}
function pilihBayar(el,v){bayarAktif=v;document.querySelectorAll('#bayarBox button').forEach(b=>b.classList.remove('on'));el.classList.add('on')}
function renderKat(){
let list = jenisAktif==='masuk'?katMasuk:katKeluar;
katAktif=list[0];
document.getElementById('catBox').innerHTML=list.map(k=>`<button type="button" onclick="pilihKat(this,'${k}')">${k}</button>`).join('');
document.querySelector('#catBox button').classList.add('on');
}
function pilihKat(el,v){katAktif=v;document.querySelectorAll('#catBox button').forEach(b=>b.classList.remove('on'));el.classList.add('on')}
function tampil(){
let masuk=0,keluar=0;
let perHari=[0,0,0,0,0,0,0];
let hari=['Sen','Sel','Rab','Kam','Jum','Sab','Min'];
data.forEach(d=>{if(d.jenis==='masuk'){masuk+=d.nominal} else {keluar+=d.nominal}});
document.getElementById('totalMasuk').innerText=rupiah(masuk);
document.getElementById('totalKeluar').innerText=rupiah(keluar);
document.getElementById('saldo').innerText=rupiah(masuk-keluar);
document.getElementById('jml').innerText=data.length+' transaksi';
// chart dari data asli, kalau kosong tampil contoh
let chartData = data.length? perHari : [120000,150000,90000,210000,700000,80000,0];
let max = Math.max(...chartData,1);
document.getElementById('chart').innerHTML=chartData.map((v,i)=>{
let h = Math.max(12, (v/max)*70);
let label = v>=1000 ? Math.round(v/1000)+'k' : v;
return `<div class="bar"><div class="val">${label}</div><div class="fill" style="height:${h}px"></div><div class="day">${hari[i]}</div></div>`
}).join('');
let html='';
data.slice().reverse().forEach((d,i)=>{
let idx=data.length-1-i;
let isMasuk=d.jenis==='masuk';
html+=`<div class="item"><div class="icon ${isMasuk?'':'out'}">${isMasuk?'↓':'↑'}</div><div><b>${d.nama||'Hamba Allah'}</b><small>${d.kat} • ${d.bayar} • ${d.tgl} • Terverifikasi</small><span class="del" onclick="hapus(${idx})">Hapus</span></div><div class="${isMasuk?'plus':'min'}">${isMasuk?'+':'-'} ${rupiah(d.nominal)}</div></div>`;
});
document.getElementById('list').innerHTML=html||'<div class="empty">Belum ada transaksi.<br>Klik + Input untuk mulai.</div>';
localStorage.setItem('kas_alikhsan_v2',JSON.stringify(data));
}
function bukaForm(j){jenisAktif=j;document.getElementById('formJudul').innerText=j==='masuk'?'Tambah Pemasukan':'Tambah Pengeluaran';renderKat();document.getElementById('modal').classList.add('show')}
function tutupForm(){document.getElementById('modal').classList.remove('show')}
function simpan(){
let nama=document.getElementById('nama').value||'Hamba Allah';
let nominal=parseInt(document.getElementById('nominal').value);
if(!nominal){alert('Isi nominal dulu, Broo!');return}
data.push({nama:nama,kat:katAktif,bayar:bayarAktif,nominal:nominal,jenis:jenisAktif,tgl:'Hari ini, '+new Date().toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit'})});
document.getElementById('nominal').value='';
tutupForm();tampil();
}
function hapus(i){if(confirm('Hapus transaksi ini?')){data.splice(i,1);tampil()}}
renderKat();tampil();
</script>
</body>
</html>
