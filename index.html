body{margin:0;font-family:Arial;background:#0f172a;color:#fff;padding:14px;padding-bottom:90px}

.saldo{font-size:32px;font-weight:900;margin:6px 0}
.row{display:flex;gap:10px;margin:12px 0}

.sheet{background:#1e293b;width:100%;max-width:480px;border-radius:18px 18px 0 0;padding:16px}

.kat button{background:#334155;color:#fff;border:0;padding:8px 10px;border-radius:20px;margin:3px}
.kat button.on{background:#16a34a}
.bayar button{flex:1;padding:11px;border:0;border-radius:10px;background:#334155;color:#fff;font-weight:700}
.bayar button.on{background:#16a34a}
.nav{position:fixed;bottom:0;left:0;right:0;background:#1e293b;display:flex;justify-content:space-around;padding:10px}
.nav button{background:none;border:0;color:#fff;font-size:13px}
.nav b{color:#4ade80;font-size:20px}
</style>
</head>
