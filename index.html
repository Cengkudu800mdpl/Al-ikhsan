<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DKM AL IKHSAN - Masjid Al Makmur</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:sans-serif}
body{background:#f1f5f9;padding-bottom:100px}
.top{background:#f97316;color:#fff;padding:22px;text-align:center}
.top small{opacity:.9;letter-spacing:1px}
.top h1{font-size:26px;margin:4px 0}
.top .saldo{font-size:38px;font-weight:800;margin:6px 0}
.top p{font-size:13px;opacity:.9}
.card{background:#fff;margin:14px;border-radius:14px;padding:16px;box-shadow:0 2px 8px rgba(0,0,0,.06)}
.row{display:flex;gap:10px}
.stat{flex:1;background:#fff7ed;border-radius:12px;padding:12px;text-align:center}
.stat b{display:block;font-size:18px}
.stat span{font-size:12px;color:#666}
.stat.masuk b{color:#16a34a}
.stat.masuk{background:#fff7ed}
.stat.keluar{background:#fff7ed}
.stat.keluar b{color:#dc2626}
.btns{display:flex;gap:10px;margin:14px}
.btn{flex:1;padding:13px;border:none;border-radius:12px;font-weight:700;font-size:15px;color:#fff}
.masuk{background:#16a34a}
.keluar{background:#dc2626}
.list h3{margin-bottom:10px}
.item{display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid #eee}
.item:last-child{border:none}
.item small{color:#888;display:block;font-size:12px}
.item b{font-size:15px}
.plus{color:#16a34a}
.min{color:#dc2626}
.del{border:none;background:none;color:#999;font-size:18px;margin-left:8px}
.empty{text-align:center;color:#999;padding:20px;font-size:14px}
.form{display:none;background:#fff;margin:14px;border-radius:14px;padding:16px}
.form input,.form select{width:100%;padding:12px;margin:6px 0;border:1px solid #ddd;border-radius:10px;font-size:15px}
.form button{width:100%;padding:13px;border:none;border-radius:10px;background:#f97316;color:#fff;font-weight:700;font-size:15px;margin-top:8px}
.batal{background:#e2e8f0!important;color:#333!important}
</style>
</head>
<body>
<div class="top">
<small>MASJID AL MAKMUR</small>
<h1>DKM AL IKHSAN</h1>
<div class="saldo" id="saldo">Rp 0</div>
<p>Saldo Kas Masjid
